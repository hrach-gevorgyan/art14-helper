# CI and releases.
#
# Every push and pull request: unit tests, the NativeAOT exe, its self-test, and the exe kept
# as a build artifact for 14 days.
#
# On main, after those pass, the release follows CHANGELOG.md:
# - a new <Version> in Art14Helper.csproj (no tag vX.Y.Z yet) with a "## [X.Y.Z]" section is
#   published as release vX.Y.Z: the tested exe, its SHA-256, and that section as the notes;
# - a version released already gets its notes rewritten from its section, so a correction in
#   the changelog reaches the release page too. Its exe and checksum stay as they were.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test and build
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
      main: ${{ steps.version.outputs.main }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # with tags, to tell whether this version is released already

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Version and changelog
        id: version
        run: |
          $version = ([xml](Get-Content Art14Helper.csproj)).Project.PropertyGroup.Version |
              Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "<Version> in Art14Helper.csproj is '$version', not X.Y.Z." }
          $entry = Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet
          $released = [bool](git tag --list "v$version")
          $main = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          if (-not $entry) {
              if ($main) { throw "Version $version has no '## [$version] - date' section in CHANGELOG.md." }
              "::warning::Version $version has no section in CHANGELOG.md yet."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "released=$("$released".ToLower())" >> $env:GITHUB_OUTPUT
          "main=$("$main".ToLower())" >> $env:GITHUB_OUTPUT
          "Version $version · changelog entry: $entry · released already: $released · on main: $main"

      - name: Unit tests
        run: dotnet test --project tests/Art14Helper.Tests/Art14Helper.Tests.csproj -c Release

      - name: Native exe and self-test
        run: ./build.ps1 -RequireAot -SelfTest

      - name: Checksum
        run: (Get-FileHash dist/Art14Helper.exe -Algorithm SHA256).Hash + '  Art14Helper.exe' | Out-File dist/Art14Helper.exe.sha256 -Encoding ascii

      - name: Keep the exe
        uses: actions/upload-artifact@v7
        with:
          name: Art14Helper-${{ steps.version.outputs.version }}
          path: dist/Art14Helper.exe*
          retention-days: 14

  release:
    name: Release
    needs: build
    if: needs.build.outputs.main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creates the tag and the release, or edits its notes
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the tested exe
        if: needs.build.outputs.released != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Art14Helper-${{ needs.build.outputs.version }}
          path: dist

      - name: Get the released checksum
        if: needs.build.outputs.released == 'true'
        run: gh release download "v$env:VERSION" --pattern '*.sha256' --dir dist

      - name: Release notes from the changelog
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String "^## \[$([regex]::Escape($env:VERSION))\]" | Select-Object -First 1).LineNumber
          $rest = @($lines[$start..($lines.Count - 1)])
          $next = ($rest | Select-String '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($next -gt 1) { $rest[0..($next - 2)] } elseif ($next -eq 1) { @() } else { $rest }
          $hash = (Get-Content dist/Art14Helper.exe.sha256).Split(' ')[0]
          $notes = @(($section -join "`n").Trim(), '', '---', '',
                     "**SHA-256** of ``Art14Helper.exe``: ``$hash``",
                     '',
                     'The exe is not code-signed, so Windows calls it an "unknown publisher". See the README for why, and for building it yourself.')
          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Publish the release
        if: needs.build.outputs.released != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Art14 Helper ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/Art14Helper.exe
            dist/Art14Helper.exe.sha256

      - name: Update the release notes
        if: needs.build.outputs.released == 'true'
        run: gh release edit "v$env:VERSION" --title "Art14 Helper $env:VERSION" --notes-file release-notes.md
